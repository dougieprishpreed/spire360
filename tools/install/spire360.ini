; Spire360's options, read at start-up from beside default.xex. 1 turns an
; option on, 0 leaves it off; spire360.txt lists what it read.
;
; spire360.txt and spire360_logic.txt (written beside default.xex each
; start) are what a bug report needs: attach them, with a screenshot
; (Back + RB saves spire360_shot_NN.bmp).

; Each scene file, texture and audio bank read, logged with its time, and
; every frame over 8 ms. It makes spire360.txt large and costs frame time.
trace_loads=0

; Every 10 s, what costs the most time a frame, and now and then each draw
; timed on the GPU (a short hitch each time): for performance reports.
profile=0

; Worker threads for the particles (0 to 3).
workers=3

; The frame rate: 0 is 60 while the frames fit, else a steady 30; 60 or 30
; keeps that one.
fps=0

; For testing: the player keeps their HP; the game's dev console godmode.
invincible=0
godmode=0
