; spire360 debug options for testing. Copy this file next to the XEX
; (game:\spire360.ini); without it every option is off. 1 turns an option
; on, 0 leaves it off. spire360.txt lists the options it read.

; The player keeps their HP (combat and events); the hits play as usual,
; damage numbers and hurt animations included.
invincible=0

; The game's own dev console "godmode": Strength, Buffer and Regen
; 999999999 on the player at the start of each fight (enemies fall in one
; hit, so runs go quickly).
godmode=0

; Each scene file, texture and audio bank read from the pack, logged with
; the time it took, and every frame over 8 ms (spire360.txt grows large).
trace_loads=0

; Every 10 s, the kinds of nodes (and scripts) that cost the most time per
; frame, to find what slows the frame rate.
profile=0
